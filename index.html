<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chevron Lines Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f1f5f9;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(14,165,233,0.18), transparent 30%),
        radial-gradient(circle at bottom left, rgba(15,118,110,0.15), transparent 30%);
    }

    .waves {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 180px;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      width: 200%;
      height: 180px;
      background: rgba(14,165,233,0.08);
      border-radius: 45%;
      animation: waveMove 14s linear infinite;
    }

    .wave:nth-child(2) {
      bottom: -30px;
      opacity: 0.5;
      animation-duration: 22s;
    }

    @keyframes waveMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-25%);
      }
    }

    .ship {
      position: absolute;
      bottom: 95px;
      left: -250px;
      width: 220px;
      height: 50px;
      background: #1e293b;
      border-radius: 0 0 30px 30px;
      animation: sail 28s linear infinite;
    }

    .ship::before {
      content: '';
      position: absolute;
      top: -35px;
      left: 45px;
      width: 90px;
      height: 35px;
      background: #334155;
      border-radius: 8px 8px 0 0;
    }

    .ship::after {
      content: '';
      position: absolute;
      top: -55px;
      left: 95px;
      width: 10px;
      height: 55px;
      background: #64748b;
      border-radius: 10px;
    }

    @keyframes sail {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 28px;
      padding: 50px 35px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(15,23,42,0.12);
    }

    .logo {
      font-size: 54px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 34px;
      color: #0f172a;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: #475569;
      margin-bottom: 40px;
      font-size: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px;
      margin-top: 18px;
      border-radius: 18px;
      text-decoration: none;
      background: white;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(15,23,42,0.06);
    }

    .btn:hover {
      transform: translateY(-4px);
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    footer {
      margin-top: 35px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .container {
        padding: 38px 24px;
        border-radius: 24px;
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        font-size: 16px;
        padding: 16px;
      }

      .logo {
        font-size: 46px;
      }

      .ship {
        transform: scale(0.7);
        bottom: 70px;
      }

      .waves {
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="waves">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="ship"></div>

  <div class="container">
    <div class="logo">⚓</div>

    <h1>Chevron Lines (C&F) Ltd.</h1>
    <div class="subtitle">Shipping Management Dashboard</div>

    <a class="btn" href="https://astoha.github.io/shipping-dashboard/" target="_blank">
      📋 Assessment List
    </a>

    <a class="btn" href="https://tohachevron.github.io/shipping-dashboard/" target="_blank">
      🚛 Delivery / Examine List
    </a>

    <footer>
      Developed by A.S. Toha
    </footer>
  </div>

</body>
</html>
